[workspace]
name = "gazebo_gymnasium"
version = "0.1.0"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

# One conda Python (3.12) for the ENTIRE stack — ROS 2 Jazzy, Gazebo Harmonic
# (with the gz.sim Python ECM bindings the in-sim harness needs), and the RL
# libraries. This collapses the old dual-Python split (source-built gz 3.13 vs
# venv 3.12), so there are no more PYTHONPATH / LD_LIBRARY_PATH lines to paste.
[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-ros-gz = "*"            # ros_gz_sim / ros_gz_bridge
gz-sim8-python = "*"             # gz.sim8 Python bindings (Joint ECM API, TestFixture)
colcon-common-extensions = "*"
pytest = "*"

# RL libraries from PyPI, resolved into the same env via pixi's uv integration.
[pypi-dependencies]
stable-baselines3 = "*"
gymnasium = "*"
tensorboard = "*"                 # train.py --tensorboard; local-only, no
                                  # external account needed, unlike W&B
                                  # (which stays an optional soft dependency)
ruff = "*"                        # lint + format, replacing flake8/ament_pep257/
                                  # yapf; see pyproject.toml's [tool.ruff] and
                                  # `pixi run format`/`pixi run lint`.
ty = "*"                          # static type checker; see pyproject.toml's
                                  # [tool.ty.rules] and `pixi run typecheck`.

# Optional: the 3 RL libraries Isaac Lab also supports alongside SB3 (see
# docs/rl_libraries.md). Kept out of the default env deliberately -- they're
# heavy (torch-dependent, large downloads) and most users of this repo don't
# need them. This environment shares `solve-group = "default"` with the base
# env so shared packages (torch, gymnasium, ...) resolve to the SAME version
# in both -- no drift between `pixi run` and `pixi run -e rl-libs`.
[feature.rl-libs.pypi-dependencies]
skrl = "*"
rl-games = "*"
rsl-rl-lib = "*"

[environments]
default = { solve-group = "default" }
rl-libs = { features = ["rl-libs"], solve-group = "default" }

[tasks]
# Build the ROS workspace (run once, and after editing ament_cmake pkgs).
build = "colcon build --symlink-install"

# Train any environment — one command, no launch needed (the default backend
# hosts the sim in-process). Every training_scripts/train.py flag passes
# straight through, so:
#   pixi run train                                  # cartpole, 4 agents
#   pixi run train --agent hopper --n_agents 16     # any registered spec
#   pixi run train --agent walker2d --timesteps 400000
train  = "bash -c 'source install/setup.sh && exec python training_scripts/train.py \"$@\"' --"

# Evaluate a trained policy (same pass-through). E.g.
#   pixi run deploy --agent hopper --n_agents 4
deploy = "bash -c 'source install/setup.sh && exec python training_scripts/deploy.py \"$@\"' --"

# Hyperparameter sweep (headless, CSV + optional W&B). E.g.
#   pixi run sweep --agent cartpole --timesteps 250000
sweep  = "bash -c 'source install/setup.sh && exec python training_scripts/sweep.py \"$@\"' --"

# Throughput benchmark — steps/s per environment, and scaling across agent
# counts. E.g. pixi run benchmark --agent hopper --scale 1,4,16,32
benchmark = "bash -c 'source install/setup.sh && exec python training_scripts/benchmark.py \"$@\"' --"

# OPTIONAL — watch a trained agent live in the Gazebo GUI. Only cartpole ships
# a launch file today; every other agent trains headless via `pixi run train`.
#   pixi run sim  (then, in another terminal) pixi run deploy --backend harness
sim = "bash -c 'source install/setup.sh && ros2 launch gazebo_gymnasium_bringup cartpole_harness.launch.py n_agents:=4 headless:=false'"

# Full suite — functional + stress + lint (ruff + copyright headers). No
# simulator needed: transport is mocked and the harness/stress tests use the
# in-process gz TestFixture (importorskip-guarded). PYTEST_DISABLE_PLUGIN_
# AUTOLOAD stops the conda ROS launch_testing pytest plugins (old hook
# signatures) from breaking collection; our tests only use pytest core.
test = "bash -c 'source install/setup.sh && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest gazebo_gymnasium_bridge/test/ -q'"
# Lint only (ruff check + ruff format --check, config in pyproject.toml,
# plus the ament copyright-header check), e.g. for a pre-commit check.
lint = "bash -c 'source install/setup.sh && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest gazebo_gymnasium_bridge/test/test_ruff.py gazebo_gymnasium_bridge/test/test_copyright.py -q'"

# Auto-format every project Python file in place with ruff (config in
# pyproject.toml's [tool.ruff]). Run this before committing; `pixi run
# lint` only checks. Also fixes auto-fixable lint findings (import order,
# etc.) -- `ruff format` alone only handles whitespace/layout.
format = "bash -c 'python -m ruff check --fix gazebo_gymnasium_bridge gazebo_gymnasium_examples training_scripts && python -m ruff format gazebo_gymnasium_bridge gazebo_gymnasium_examples training_scripts'"

# Static type check (ty, config in pyproject.toml's [tool.ty.rules]).
# Excludes the rl-libs-only scripts, which need `pixi run -e rl-libs
# typecheck-rl-libs` instead -- checking them under the default env reports
# skrl/rl_games/rsl_rl as unresolved imports (they're not installed there).
typecheck = "bash -c 'source install/setup.sh && python -m ty check gazebo_gymnasium_bridge training_scripts --exclude \"training_scripts/train_skrl.py\" --exclude \"training_scripts/train_rl_games.py\" --exclude \"training_scripts/train_rsl_rl.py\"'"
# Run as: pixi run -e rl-libs typecheck-rl-libs
typecheck-rl-libs = "bash -c 'source install/setup.sh && python -m ty check training_scripts/train_skrl.py training_scripts/train_rl_games.py training_scripts/train_rsl_rl.py'"
