[workspace]
name = "gazebo_gymnasium"
version = "0.1.0"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

# One conda Python (3.12) for the ENTIRE stack — ROS 2 Jazzy, Gazebo Harmonic
# (with the gz.sim Python ECM bindings the in-sim harness needs), and the RL
# libraries. This collapses the old dual-Python split (source-built gz 3.13 vs
# venv 3.12), so there are no more PYTHONPATH / LD_LIBRARY_PATH lines to paste.
[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-ros-gz = "*"            # ros_gz_sim / ros_gz_bridge
gz-sim8-python = "*"             # gz.sim8 Python bindings (Joint ECM API, TestFixture)
colcon-common-extensions = "*"
pytest = "*"

# RL libraries from PyPI, resolved into the same env via pixi's uv integration.
[pypi-dependencies]
stable-baselines3 = "*"
gymnasium = "*"
autopep8 = ">=2.3.2, <3"

[tasks]
# Build the ROS workspace (run once, and after editing ament_cmake pkgs).
build = "colcon build --symlink-install"

# Simulator (terminal 1). Override args with e.g.
#   pixi run sim  (defaults) or: pixi run -- bash -c 'source install/setup.sh && ros2 launch ...'
sim = "bash -c 'source install/setup.sh && ros2 launch gazebo_gymnasium_bringup cartpole_multi.launch.py n_agents:=4 headless:=false'"

# Training / eval (terminal 2).
train  = "bash -c 'source install/setup.sh && python training_scripts/train.py  --agent cartpole --n_agents 4'"
deploy = "bash -c 'source install/setup.sh && python training_scripts/deploy.py --agent cartpole --n_agents 4'"

# Test suite (no simulator needed — transport is mocked). PYTEST_DISABLE_
# PLUGIN_AUTOLOAD stops the conda ROS launch_testing pytest plugins (old hook
# signatures) from breaking collection; our tests only use pytest core.
test = "bash -c 'source install/setup.sh && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest gazebo_gymnasium_bridge/test/test_compile.py gazebo_gymnasium_bridge/test/test_agent_spec.py gazebo_gymnasium_bridge/test/test_multi_agent_env.py gazebo_gymnasium_bridge/test/test_library_integration.py -q'"
