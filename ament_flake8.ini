[flake8]
# Project-level ament_flake8 config. Mirrors the bundled ROS 2 defaults
# (extend-ignore values, line length, import-order style) and adds two
# project-wide deltas:
#   1. Permit double quotes (the bundled config defaults to single via
#      flake8-quotes — we standardize on double following the modern
#      Python / black / ruff convention).
#   2. Ignore F541 because some auto-generated stub plugin templates use
#      f-strings without placeholders for forward-compatibility with
#      formatted messages.
#
# Usage:
#   ament_flake8 --config ament_flake8.ini <paths...>
# Or set it as the default for `colcon test`:
#   colcon build … --cmake-args -DAMENT_FLAKE8_CONFIG_FILE=$(pwd)/ament_flake8.ini

extend-ignore =
    B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,
    F541
import-order-style = google
# Tell flake8-import-order which packages are first-party so they get their
# own block AFTER third-party (matches the standard stdlib → third-party →
# first-party ordering).
application-import-names = gazebo_gymnasium_bridge,gazebo_gymnasium_resources,gazebo_gymnasium_bringup
max-line-length = 99
show-source = true
statistics = true

# Permit double quotes (overrides flake8-quotes' single-quote default).
inline-quotes = double
multiline-quotes = double
docstring-quotes = double
