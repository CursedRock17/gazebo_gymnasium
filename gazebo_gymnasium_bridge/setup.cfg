[develop]
script_dir=$base/lib/gazebo_gymnasium_bridge
[install]
install_scripts=$base/lib/gazebo_gymnasium_bridge

[flake8]
# 99 matches the ROS 2 Developer Guide default. 88 (black's default) was
# tempting but most ROS 2 repos use 99, so we follow that for consistency
# with the wider ecosystem.
max-line-length = 99
# E203 conflicts with PEP 8's slice-style operator spacing.
# W503 is the "line break before binary operator" rule that PEP 8 itself
# now recommends violating.
extend-ignore = E203, W503
# flake8-quotes default is single — we standardize on double across the
# codebase (modern Python / black / ruff convention). Setting this here
# stops `ament_flake8` from flagging 500+ Q000s.
inline-quotes = double
multiline-quotes = double
docstring-quotes = double

[pep257]
# Allow single-line docstrings on utility functions (D200 / D205 / D400).
# Enforce the rest — class docs, module docs, etc.
add-ignore = D200, D205, D400
