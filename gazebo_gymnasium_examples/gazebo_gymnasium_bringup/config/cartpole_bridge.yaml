# ros_gz_bridge mappings for the cartpole world.
#
# This file is loaded via `parameter_bridge --ros-args -p config_file:=...`
# in `launch/cartpole.launch.py`. One YAML per launch keeps the launch
# files terse and lets the topic list be reviewed in isolation.
#
# Direction: GZ_TO_ROS for sensor / state data, BIDIRECTIONAL when ROS
# clients need to command gz (none here yet).
#
# QoS overrides matter for sensor-stream topics (camera images, scans)
# where the gz side publishes BEST_EFFORT and a default-RELIABLE ROS
# subscriber would silently drop packets.

- ros_topic_name: "/tf"
  gz_topic_name: "/world/cartpole/pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/cartpole/model/cartpole/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/world/cartpole/stats"
  gz_topic_name: "/world/cartpole/stats"
  ros_type_name: "ros_gz_interfaces/msg/WorldStatistics"
  gz_type_name: "gz.msgs.WorldStatistics"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/world/cartpole/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
