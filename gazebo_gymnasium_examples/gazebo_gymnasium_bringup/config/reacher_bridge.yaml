# ros_gz_bridge mappings for the reacher world. See cartpole_bridge.yaml
# for the structure rationale.

- ros_topic_name: "/tf"
  gz_topic_name: "/world/reacher/pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/reacher/model/reacher/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/world/reacher/stats"
  gz_topic_name: "/world/reacher/stats"
  ros_type_name: "ros_gz_interfaces/msg/WorldStatistics"
  gz_type_name: "gz.msgs.WorldStatistics"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/world/reacher/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
