[pep257]
# Project-level ament_pep257 config. Ignored rules (in addition to ament's
# bundled defaults):
#   D213 — "Multi-line docstring summary should start at the second line".
#          We use first-line summaries (PEP 257 / black / ruff convention).
#          Mirrors the rationale for our `inline-quotes = double` flake8
#          override.
#   D202 — "No blank lines allowed after function docstring". A blank line
#          after the docstring often improves readability when the function
#          body opens with logic rather than a comment.
#   D100, D101, D102, D103, D104, D105, D106, D107 — "Missing docstring"
#          rules. We add docstrings where they aid the reader, not as
#          mandatory boilerplate (matches ament_flake8 defaults).
add-ignore = D100,D101,D102,D103,D104,D105,D106,D107,D202,D203,D212,D213
