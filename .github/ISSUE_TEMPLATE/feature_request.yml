name: Feature request
description: Suggest a capability or a new environment
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: |
        **Proposing a new environment?** Most robots need no framework changes —
        see [Creating your own agent](../../blob/main/docs/creating_your_own_agent.md)
        and the annotated [Porting Hopper](../../blob/main/docs/examples/porting_hopper.md)
        walkthrough. Please say what the framework is *missing* for your case
        (e.g. a 3D free base needs a link-state observation extension).
