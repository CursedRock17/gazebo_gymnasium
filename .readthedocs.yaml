# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The API reference is built with autodoc against the pure-Python spec/env
# layer. Native dependencies (gz-transport, gz-sim, torch) are mocked in
# docs/sphinx/conf.py via autodoc_mock_imports, so the docs build needs only
# Sphinx — not a full ROS 2 + Gazebo environment.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
